# Auto-register the extensions listed in
# META-INF/services/org.junit.jupiter.api.extension.Extension.
#
# Used for DisableSkipHeuristicExtension, which must apply to every test and
# must work under any runner — IntelliJ launches tests with its own JUnit
# runner and never reads the Surefire configuration in pom.xml.
junit.jupiter.extensions.autodetection.enabled=true
